<svg xmlns="http://www.w3.org/2000/svg" viewBox="-170 -170 340 340" role="img" aria-label="Shri Chandrika Singh Social and Cultural Foundation logo">
  <defs>
    <path id="topArc" d="M -143.8,25.4 A 146,146 0 1 1 143.8,25.4" />
    <path id="botArc" d="M 138,0 A 138,138 0 0 1 -138,0" />
    <g id="person">
      <!-- pinwheel blade pointing up with slight clockwise lean -->
      <path d="M 0,4 C 16,-34 26,-74 7,-104 C -12,-80 -14,-40 0,4 Z"/>
      <circle cx="6" cy="-116" r="17"/>
    </g>
  </defs>

  <!-- outer red ring -->
  <circle cx="0" cy="0" r="162" fill="#ffffff"/>
  <circle cx="0" cy="0" r="160" fill="#b11226"/>
  <circle cx="0" cy="0" r="128" fill="#ffffff"/>

  <!-- curved text -->
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#ffffff" font-size="13.4" letter-spacing="0.9">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">SHRI CHANDRIKA SINGH SOCIAL AND CULTURAL FOUNDATION</textPath>
  </text>
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#ffffff" font-size="20" letter-spacing="1.6">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">Bhojpur, Chatar</textPath>
  </text>

  <!-- six united figures / pinwheel -->
  <g transform="scale(0.82)">
    <use href="#person" fill="#fbb040" transform="rotate(0)"/>
    <use href="#person" fill="#0e9447" transform="rotate(60)"/>
    <use href="#person" fill="#29abe2" transform="rotate(120)"/>
    <use href="#person" fill="#1b75bb" transform="rotate(180)"/>
    <use href="#person" fill="#ed1c24" transform="rotate(240)"/>
    <use href="#person" fill="#f7931e" transform="rotate(300)"/>
  </g>
</svg>
